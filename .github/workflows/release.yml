   name: Gerar instaladores

   on:
     push:
       tags: ['v*']
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     build:
       strategy:
         matrix:
           os: [windows-latest, macos-latest]
       runs-on: ${{ matrix.os }}
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - name: Instalar dependências
           run: npm install
           env:
             PUPPETEER_SKIP_DOWNLOAD: 'true'
         - name: Gerar instalador e publicar na Release
           run: npm run release
           env:
             GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
